name: plain
description: "素记 Plain - local-first minimal bookkeeping"
publish_to: 'none'
version: 1.1.0+4

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2

  sqlite3: ^3.6.0
  path_provider: ^2.1.5
  path: ^1.9.1

  json_annotation: ^4.12.0
  intl: ^0.20.3
  crypto: ^3.0.6

  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  shared_preferences: ^2.5.3

  fl_chart: ^0.70.2

  share_plus: ^10.1.4
  audioplayers: ^6.1.0

  cupertino_icons: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/audio/

# sqlite3 hook downloads prebuilt native lib from GitHub releases.
# `source: sqlcipher` 选用 SQLCipher 构建（C6 全库加密，04-§10.1 方案 A），
# 与 sqlite3 同 ABI，@Native 直接绑定，无需 open.overrideFor。
# Direct GitHub is often unreachable here — route through a mirror.
# $RELEASE_TAG / $FILENAME are substituted by package:sqlite3.
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
      url_pattern: "https://ghfast.top/https://github.com/simolus3/sqlite3.dart/releases/download/$RELEASE_TAG/$FILENAME"
